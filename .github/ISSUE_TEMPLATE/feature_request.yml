name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
