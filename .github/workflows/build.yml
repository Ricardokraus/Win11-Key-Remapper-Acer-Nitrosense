name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create and publish releases on tags

# The release is the script itself, run with AutoHotkey v2: no exe for now.
# Windows 11's Smart App Control blocks unsigned exes with no way to allow
# them; AutoHotkey is signed. A signed exe is planned (docs/DEVELOPMENT.md).
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Official GitHub releases. autohotkey.com sits behind Cloudflare,
          # which can block CI runners. The zip is the same file.
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          $tag = gh release list -R AutoHotkey/AutoHotkey --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName' |
                 Where-Object { $_ -like 'v2.*' } | Select-Object -First 1
          if (-not $tag) { Write-Error 'No AutoHotkey v2 release found'; exit 1 }
          gh release download $tag -R AutoHotkey/AutoHotkey -p 'AutoHotkey_*.zip' -D $tools
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive (Get-Item "$tools\AutoHotkey_*.zip").FullName "$tools\ahk" -Force
          "AHK=$tools\ahk\AutoHotkey64.exe" >> $env:GITHUB_ENV
          (Get-Item "$tools\ahk\AutoHotkey64.exe").VersionInfo.ProductVersion

      - name: Check syntax
        run: |
          $p = Start-Process $env:AHK -ArgumentList '/ErrorStdOut', '/Validate', 'src\Win11KeyRemapper.ahk' `
                 -Wait -PassThru -NoNewWindow -RedirectStandardError validate.txt
          Get-Content validate.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Run tests
        run: ./tests/run-tests.ps1 -Ahk $env:AHK

      - name: Package
        id: package
        run: |
          $version = (Select-String -Path src\Win11KeyRemapper.ahk -Pattern '\bversion: "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          $exeVersion = (Select-String -Path src\Win11KeyRemapper.ahk -Pattern '^;@Ahk2Exe-SetVersion\s+(\S+)').Matches[0].Groups[1].Value
          if ($version -ne $exeVersion) {
            Write-Error "APP.version ($version) and ;@Ahk2Exe-SetVersion ($exeVersion) differ"
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME doesn't match the version in the script ($version)"
              exit 1
            }
            $name = "Win11KeyRemapper-v$version"
          } else {
            $name = "Win11KeyRemapper-v$version-dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          # Only what's needed to run it: src\ (the app) and assets\icon.ico
          # (its tray and window icon, found as ..\assets from src\)
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force "$dir\src\lib", "$dir\assets" | Out-Null
          Copy-Item src\Win11KeyRemapper.ahk "$dir\src"
          Copy-Item src\lib\GlassToast.ahk "$dir\src\lib"
          Copy-Item assets\icon.ico "$dir\assets"
          Copy-Item README.md, LICENSE, CHANGELOG.md, settings.example.ini, SUPPORT.md, SECURITY.md $dir
          New-Item -ItemType Directory -Force "$dir\docs" | Out-Null
          Copy-Item docs\FAQ.md, docs\TESTED-MODELS.md "$dir\docs"     # linked from the README
          Compress-Archive "$dir\*" "dist\$name.zip" -Force
          $sums = "$((Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower())  $name.zip"
          $sums | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          $sums
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      # Draft first, assets attached, then published: works with immutable releases
      - name: Create release (draft)
        id: release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: |
            **How to use it:** install [AutoHotkey v2](https://www.autohotkey.com/) (free), extract
            `${{ steps.package.outputs.name }}.zip` to a folder you'll keep and double-click
            `src\Win11KeyRemapper.ahk`. Updating: click *Exit* in the app, extract the new zip over
            the old folder (your `settings.ini` stays) and open it again.
            Details in the [README](https://github.com/${{ github.repository }}#installation).
          files: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          $api = "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          gh api -X PATCH $api -F draft=false -f make_latest=true | Out-Null
          if ($LASTEXITCODE) { exit 1 }
