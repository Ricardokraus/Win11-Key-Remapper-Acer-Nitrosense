; Windows 11 Key Remapper - example settings
;
; You don't need this file: the app creates settings.ini on first run and
; you can change everything from the tray icon > Settings...
; To use it anyway, copy it next to Win11KeyRemapper.exe as settings.ini
; and restart the app. Missing keys fall back to the defaults shown here.
;
; VK = virtual-key code, SC = scan code, both in hex (0x...). The settings
; window shows them next to each key.

[Remap]
; Key to remap. Default: the Acer NitroSense key.
SourceVK=0xFF
SourceSC=0x175
; "Exact key match": 1 = also compare the scan code. Needed for the NitroSense
; key: Win Lock on/off (Fn+Win) use the same VK 0xFF with SC 0x159 / 0x162.
MatchSC=1
; NumLock | CapsLock | ScrollLock | Key | Disable | None
Mode=NumLock
; Mode=Key only: the key to press instead, and optional modifiers held with
; it, comma-separated: LCtrl RCtrl LAlt RAlt LShift RShift LWin RWin
; Example (Ctrl+Shift+Esc): TargetMods=LCtrl,LShift  TargetVK=0x1B  TargetSC=0x1
TargetMods=
TargetVK=0x0
TargetSC=0x0

[Launcher]
; Optional shortcut that opens an app. Default: Right Ctrl + NitroSense key
; opens NitroSense.
LaunchEnabled=1
; Exact set of modifiers that must be held (empty = none)
LaunchMods=RCtrl
LaunchVK=0xFF
LaunchSC=0x175
; 1 = Ctrl/Alt/Shift/Win on either side of the keyboard
LaunchAnySide=0
; auto = find NitroSense, or a path to an .exe / .lnk, or shell:AppsFolder\<AppID>
LaunchPath=auto

[General]
; When to show the "app is running" notification: Always (at startup, after
; unlocking and when the display turns back on) | Startup | Never
ToastWhen=Always
; TopCenter | TopRight | TopLeft | BottomCenter | BottomRight | BottomLeft
ToastPosition=TopCenter
; Slide | Fade | None
ToastAnimation=Slide
; 1 = frosted glass (blurs what's behind), 0 = solid card in the settings
; window's colors: lighter for older or low-power PCs
ToastTransparency=1
; 0 = hide the tray icon (open the app again to reach the settings)
TrayIcon=1
; 1 = look for a new version on GitHub once a day
CheckUpdates=1
; Settings window and tray menu: System | Light | Dark
Theme=System
