<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Windows 11 Key Remapper</title>
  <desc id="desc">NitroSense Key Remapper: turn the NitroSense key into Num Lock, disable it, or remap it to any key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1310"/>
      <stop offset="1" stop-color="#12261A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#30D158" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22A84A"/>
      <stop offset="1" stop-color="#11632B"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AE57E"/>
      <stop offset="1" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C3A31"/>
      <stop offset="1" stop-color="#202B24"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- App icon: green keycap with swap arrows (same drawing as assets/icon.ico) -->
  <g transform="translate(92 60) scale(0.78125)">
    <rect x="8" y="12" width="240" height="236" rx="56" fill="url(#body)"/>
    <rect x="30" y="20" width="196" height="180" rx="40" fill="url(#face)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 86H176M153 61l25 25-25 25"/>
      <path d="M178 136H80M103 111l-25 25 25 25"/>
    </g>
  </g>

  <g font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="352" y="114" font-size="54" font-weight="700" fill="#FFFFFF">Windows 11 Key Remapper</text>
    <text x="354" y="156" font-size="25" font-weight="600" fill="#30D158">NitroSense Key Remapper</text>

    <!-- NitroSense key -> Num Lock -->
    <g transform="translate(354 184)">
      <rect y="6" width="172" height="48" rx="12" fill="#070B09"/>
      <rect width="172" height="46" rx="12" fill="url(#chip)" stroke="#3B4C41"/>
      <text x="86" y="30" font-size="19" font-weight="600" fill="#EEF3EF" text-anchor="middle">NitroSense</text>
      <path d="M196 23H244M232 11l12 12-12 12" fill="none" stroke="#30D158" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="268" y="6" width="150" height="48" rx="12" fill="#11632B"/>
      <rect x="268" width="150" height="46" rx="12" fill="url(#face)"/>
      <text x="343" y="30" font-size="19" font-weight="700" fill="#06260F" text-anchor="middle">Num Lock</text>
    </g>

    <text x="354" y="280" font-size="20" fill="#B9C4BD">Turn it into Num Lock, disable it, or remap it to any key. No install.</text>
  </g>
</svg>
